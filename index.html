<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>벽돌깨기 게임</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: radial-gradient(circle at top, #26345c, #0b1020 65%);
    font-family: Arial, sans-serif;
    color: white;
    overflow: hidden;
  }
  .game-wrap {
    width: min(94vw, 760px);
    text-align: center;
  }
  h1 {
    margin: 0 0 10px;
    font-size: clamp(24px, 5vw, 40px);
  }
  .info {
    display: flex;
    justify-content: space-between;
    margin: 0 auto 10px;
    width: min(94vw, 700px);
    font-weight: bold;
    font-size: 16px;
  }
  canvas {
    display: block;
    width: 100%;
    max-width: 700px;
    aspect-ratio: 7 / 5;
    margin: auto;
    border: 3px solid rgba(255,255,255,.75);
    border-radius: 14px;
    background: #11182d;
    box-shadow: 0 12px 40px rgba(0,0,0,.45);
    touch-action: none;
  }
  .buttons { margin-top: 12px; }
  button {
    border: 0;
    border-radius: 10px;
    padding: 11px 20px;
    margin: 4px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
  }
  #startBtn { background: #62e6a5; color: #08130e; }
  #pauseBtn { background: #ffd166; color: #241b00; }
  .help { opacity: .8; font-size: 13px; margin-top: 8px; }
</style>
</head>
<body>
<div class="game-wrap">
  <h1>🧱 벽돌깨기</h1>
  <div class="info">
    <span>점수: <b id="score">0</b></span>
    <span>목숨: <b id="lives">3</b></span>
    <span>레벨: <b id="level">1</b></span>
  </div>
  <canvas id="game" width="700" height="500"></canvas>
  <div class="buttons">
    <button id="startBtn">게임 시작</button>
    <button id="pauseBtn">일시정지</button>
  </div>
  <div class="help">← → 방향키 / 마우스 / 터치로 패들을 움직이세요.</div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const scoreEl = document.getElementById("score");
const livesEl = document.getElementById("lives");
const levelEl = document.getElementById("level");
const startBtn = document.getElementById("startBtn");
const pauseBtn = document.getElementById("pauseBtn");

const W = canvas.width, H = canvas.height;

let score = 0, lives = 3, level = 1;
let running = false, paused = false, gameOver = false;
let animationId;
let keys = { left:false, right:false };

const paddle = {
  w: 110, h: 14, x: W/2 - 55, y: H - 35, speed: 8
};

const ball = {
  x: W/2, y: H - 55, r: 8,
  dx: 4, dy: -4
};

let bricks = [];

function makeBricks() {
  bricks = [];
  const rows = Math.min(4 + level, 8);
  const cols = 10;
  const gap = 7;
  const bw = (W - 50 - gap*(cols-1)) / cols;
  const bh = 22;

  for (let r=0; r<rows; r++) {
    for (let c=0; c<cols; c++) {
      bricks.push({
        x: 25 + c*(bw+gap),
        y: 55 + r*(bh+gap),
        w: bw, h: bh,
        alive: true,
        hue: (r*35 + c*8 + level*20) % 360
      });
    }
  }
}

function resetBall() {
  ball.x = W/2;
  ball.y = H - 55;
  const speed = Math.min(7.5, 4 + (level-1)*0.35);
  ball.dx = (Math.random() > .5 ? 1 : -1) * speed;
  ball.dy = -speed;
  paddle.x = W/2 - paddle.w/2;
}

function resetGame() {
  score = 0; lives = 3; level = 1;
  gameOver = false; paused = false;
  makeBricks();
  resetBall();
  updateUI();
  draw();
}

function nextLevel() {
  level++;
  makeBricks();
  resetBall();
  updateUI();
}

function updateUI() {
  scoreEl.textContent = score;
  livesEl.textContent = lives;
  levelEl.textContent = level;
}

function drawRoundedRect(x,y,w,h,r) {
  ctx.beginPath();
  ctx.roundRect(x,y,w,h,r);
  ctx.fill();
}

function draw() {
  ctx.clearRect(0,0,W,H);

  // 배경
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"#182448");
  g.addColorStop(1,"#090d1b");
  ctx.fillStyle = g;
  ctx.fillRect(0,0,W,H);

  // 별
  ctx.fillStyle = "rgba(255,255,255,.22)";
  for (let i=0;i<45;i++) {
    const x=(i*97)%W, y=(i*53)%H;
    ctx.fillRect(x,y,2,2);
  }

  // 벽돌
  bricks.forEach(b=>{
    if (!b.alive) return;
    const grad=ctx.createLinearGradient(b.x,b.y,b.x,b.y+b.h);
    grad.addColorStop(0,`hsl(${b.hue},85%,65%)`);
    grad.addColorStop(1,`hsl(${b.hue},75%,42%)`);
    ctx.fillStyle=grad;
    drawRoundedRect(b.x,b.y,b.w,b.h,5);
    ctx.fillStyle="rgba(255,255,255,.22)";
    drawRoundedRect(b.x+4,b.y+3,b.w-8,4,2);
  });

  // 패들
  const pg=ctx.createLinearGradient(paddle.x,paddle.y,paddle.x,paddle.y+paddle.h);
  pg.addColorStop(0,"#ffffff");
  pg.addColorStop(1,"#7dd3fc");
  ctx.fillStyle=pg;
  drawRoundedRect(paddle.x,paddle.y,paddle.w,paddle.h,7);

  // 공
  const bg=ctx.createRadialGradient(ball.x-3,ball.y-3,1,ball.x,ball.y,ball.r);
  bg.addColorStop(0,"#ffffff");
  bg.addColorStop(1,"#60a5fa");
  ctx.fillStyle=bg;
  ctx.beginPath();
  ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);
  ctx.fill();

  if (!running || paused || gameOver) {
    ctx.fillStyle="rgba(0,0,0,.52)";
    ctx.fillRect(0,0,W,H);
    ctx.textAlign="center";
    ctx.fillStyle="#fff";
    ctx.font="bold 32px Arial";
    let title = gameOver ? "GAME OVER" : paused ? "PAUSED" : "벽돌깨기";
    ctx.fillText(title,W/2,H/2-15);
    ctx.font="18px Arial";
    ctx.fillStyle="#dbeafe";
    ctx.fillText(
      gameOver ? "게임 시작 버튼을 눌러 다시 도전하세요!" :
      paused ? "일시정지 버튼으로 계속할 수 있어요." :
      "게임 시작 버튼을 눌러 시작하세요!",
      W/2,H/2+25
    );
  }
}

function update() {
  if (!running || paused || gameOver) {
    draw();
    return;
  }

  if (keys.left) paddle.x -= paddle.speed;
  if (keys.right) paddle.x += paddle.speed;
  paddle.x = Math.max(0, Math.min(W-paddle.w, paddle.x));

  ball.x += ball.dx;
  ball.y += ball.dy;

  if (ball.x-ball.r <= 0 || ball.x+ball.r >= W) {
    ball.dx *= -1;
    ball.x = Math.max(ball.r, Math.min(W-ball.r, ball.x));
  }
  if (ball.y-ball.r <= 0) {
    ball.dy *= -1;
    ball.y = ball.r;
  }

  // 패들 충돌
  if (
    ball.dy > 0 &&
    ball.y+ball.r >= paddle.y &&
    ball.y-ball.r <= paddle.y+paddle.h &&
    ball.x >= paddle.x &&
    ball.x <= paddle.x+paddle.w
  ) {
    const hit = (ball.x - (paddle.x+paddle.w/2)) / (paddle.w/2);
    const speed = Math.min(8.5, Math.sqrt(ball.dx*ball.dx + ball.dy*ball.dy) + 0.08);
    ball.dx = hit * speed;
    ball.dy = -Math.sqrt(Math.max(4, speed*speed-ball.dx*ball.dx));
    ball.y = paddle.y-ball.r-1;
  }

  // 벽돌 충돌
  for (const b of bricks) {
    if (!b.alive) continue;
    if (
      ball.x+ball.r > b.x &&
      ball.x-ball.r < b.x+b.w &&
      ball.y+ball.r > b.y &&
      ball.y-ball.r < b.y+b.h
    ) {
      b.alive = false;
      score += 10;
      updateUI();

      const overlapX = Math.min(ball.x+ball.r-b.x, b.x+b.w-(ball.x-ball.r));
      const overlapY = Math.min(ball.y+ball.r-b.y, b.y+b.h-(ball.y-ball.r));
      if (overlapX < overlapY) ball.dx *= -1;
      else ball.dy *= -1;
      break;
    }
  }

  if (ball.y-ball.r > H) {
    lives--;
    updateUI();
    if (lives <= 0) {
      gameOver = true;
      running = false;
    } else {
      resetBall();
    }
  }

  if (bricks.every(b=>!b.alive)) nextLevel();

  draw();
  animationId = requestAnimationFrame(update);
}

function startGame() {
  if (gameOver) resetGame();
  running = true;
  paused = false;
  pauseBtn.textContent = "일시정지";
  cancelAnimationFrame(animationId);
  animationId = requestAnimationFrame(update);
}

startBtn.addEventListener("click", startGame);

pauseBtn.addEventListener("click", () => {
  if (!running && !gameOver) return;
  paused = !paused;
  pauseBtn.textContent = paused ? "계속하기" : "일시정지";
  if (!paused) {
    cancelAnimationFrame(animationId);
    animationId = requestAnimationFrame(update);
  }
  draw();
});

window.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft") { keys.left=true; e.preventDefault(); }
  if (e.key === "ArrowRight") { keys.right=true; e.preventDefault(); }
  if (e.key === " " && running) {
    paused = !paused;
    pauseBtn.textContent = paused ? "계속하기" : "일시정지";
    if (!paused) animationId = requestAnimationFrame(update);
    draw();
  }
});
window.addEventListener("keyup", e => {
  if (e.key === "ArrowLeft") keys.left=false;
  if (e.key === "ArrowRight") keys.right=false;
});

function movePaddle(clientX) {
  const rect=canvas.getBoundingClientRect();
  const scale=W/rect.width;
  paddle.x = (clientX-rect.left)*scale - paddle.w/2;
  paddle.x = Math.max(0,Math.min(W-paddle.w,paddle.x));
}
canvas.addEventListener("mousemove", e=>movePaddle(e.clientX));
canvas.addEventListener("touchmove", e=>{
  e.preventDefault();
  movePaddle(e.touches[0].clientX);
},{passive:false});

resetGame();
</script>
</body>
</html>
